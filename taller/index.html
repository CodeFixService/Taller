<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="robots" content="noindex">
<title>Mi taller</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/app.css?v=2.2">
<link rel="stylesheet" href="../shared/tema.css">
<style>
  .slot { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .slot:last-child { border-bottom: 0; }
  .slot .h { width: 50px; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 6px; }
  .slot .c { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .res { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; cursor: pointer; }
  .res.bloq { background: repeating-linear-gradient(45deg, var(--field), var(--field) 6px, var(--line) 6px, var(--line) 8px); cursor: default; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .swatches button { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); }
  .swatches button.on { box-shadow: 0 0 0 2px var(--text); }
  .iconos button { font-size: 22px; width: 44px; height: 44px; padding: 0; background: var(--field); border: 1px solid var(--line); }
  .iconos button.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .slotpago { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .slotpago.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .barra { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .barra i { display: block; height: 100%; background: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { margin: 0; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--text); font-size: 14px; font-weight: 500; }
  .bar-mes { display: flex; align-items: flex-end; gap: 8px; height: 140px; margin-top: 10px; }
  .bar-mes div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .bar-mes span { width: 100%; background: var(--brand); border-radius: 6px 6px 0 0; min-height: 2px; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
  .fotos figure { margin: 0; position: relative; } .fotos figcaption { font-size: 12px; color: var(--muted); }
  .fotos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; }
  .fotos button { position: absolute; top: 4px; right: 4px; padding: 2px 8px; }
</style>
<script src="../shared/humano.js"></script>
<script>window.CFX_BARRA = { orden: ['hoy', 'agenda', '+', 'reservas', 'mas'], nuevo: { texto: 'Reserva', ir: 'agenda', click: '#agNueva' } }; // barra de abajo (núcleo)</script>
</head>
<body class="con-tabs">
<header class="top">
  <div class="logo" id="hLogo"></div><h1 id="hNombre">Mi taller</h1>
  <button class="icon-btn" id="chatBtn" type="button"></button>
  <button class="icon-btn" id="campana" type="button"></button>
</header>
<main>
  <p class="empty" id="cargando">Cargando…</p>

  <!-- HOY -->
  <section class="view" id="v-hoy">
    <div id="bienvenida"></div>
    <div class="stats">
      <div class="card clic" data-ir="reservas:revisar"><span>🧾 Por revisar</span><b id="kRev">0</b></div>
      <div class="card clic" data-ir="agenda"><span>📅 Reservas hoy</span><b id="kHoy">0</b></div>
      <div class="card clic" data-ir="reservas:taller"><span>🔧 En el taller</span><b id="kTaller">0</b></div>
      <div class="card clic" data-ir="reservas:devolver"><span>💸 Por devolver</span><b id="kDev">0</b></div>
    </div>
    <div class="card" id="cRevisar"><h2>🧾 Comprobantes por revisar</h2><div class="grid" id="hRevisar"></div></div>
    <div class="card"><h2>📅 Hoy</h2><div class="grid" id="hHoy"></div></div>
    <div class="card hidden" id="cDevolver"><h2>💸 Abonos por devolver</h2><div class="grid" id="hDevolver"></div></div>
    <div class="card hidden" id="cPagando"><h2>⏳ Esperando pago</h2><ul class="list" id="hPagando"></ul></div>
    <div class="card" id="cEnlace"><h2>🔗 Tu página de reservas</h2><p class="muted" style="margin-top:0">Compártela en WhatsApp, Instagram o imprime el QR.</p>
      <div class="link" id="hLink"></div><div class="btns"><button id="hCompartir" type="button">📤 Compartir</button><button class="alt" id="hQR" type="button">QR</button><a class="btn ghost" id="hAbrir" target="_blank" rel="noopener">Ver</a></div></div>
    <div id="hReferidos"></div>
    <div id="hPlanCard"></div>
  </section>

  <!-- AGENDA -->
  <section class="view" id="v-agenda">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <input type="date" id="agFecha" aria-label="Fecha" style="flex:1 1 150px">
      <button class="small" id="agNueva" type="button" style="flex:0 0 auto">＋ Reserva</button>
      <button class="small ghost" id="agBloq" type="button" style="flex:0 0 auto">⛔ Bloquear</button>
    </div>
    <div class="dias" id="agDias"></div>
    <div class="card"><h2 id="agTit"></h2><div id="agSlots"></div></div>
  </section>

  <!-- RESERVAS -->
  <section class="view" id="v-reservas">
    <div class="seg" id="rSeg">
      <button data-f="revisar" class="on">🧾 Por revisar</button>
      <button data-f="proximas">📅 Próximas</button>
      <button data-f="taller">🔧 En el taller</button>
      <button data-f="pagando">⏳ Esperando pago</button>
      <button data-f="devolver">💸 Por devolver</button>
      <button data-f="historial">📚 Historial</button>
    </div>
    <input id="rBuscar" placeholder="Buscar por nombre, teléfono o bici…" aria-label="Buscar" style="margin-bottom:12px">
    <div class="grid" id="rLista"></div>
  </section>

  <!-- DETALLE -->
  <section class="view" id="v-detalle" data-tab="reservas"></section>

  <!-- CLIENTES -->
  <section class="view" id="v-clientes">
    <input id="cBuscar" placeholder="Buscar cliente…" aria-label="Buscar cliente" style="margin-bottom:10px">
    <p class="sub" id="cCuenta"></p>
    <div class="card"><ul class="list" id="cLista"></ul></div>
  </section>

  <!-- MÁS -->
  <section class="view" id="v-mas">
    <div class="seg" id="mSeg">
      <button data-m="chat">💬 Mensajes<span class="badge hidden chat-num"></span></button>
      <button data-m="compartir">📣 Compartir</button>
      <button data-m="perfil" class="dueno">🏪 Perfil</button>
      <button data-m="horario" class="dueno">⏰ Horario</button>
      <button data-m="servicios" class="dueno">🛠️ Servicios</button>
      <button data-m="abono" class="dueno">💳 Abono</button>
      <button data-m="promos" class="dueno">🏷️ Promociones</button>
      <button data-m="plan" class="dueno">⭐ Plan</button>
      <button data-m="equipo">👥 Equipo</button>
      <button data-m="stats">📊 Estadísticas</button>
      <button data-m="recordar">🔔 Recordatorios</button>
      <button data-m="cuenta">👤 Mi cuenta</button>
    </div>
    <div id="mBody"></div>
  </section>
</main>

<nav class="tabs">
  <button data-v="hoy"><span class="i">🏠</span>Hoy</button>
  <button data-v="agenda"><span class="i">📅</span>Agenda</button>
  <button data-v="reservas"><span class="i">🧾</span>Reservas<span class="badge hidden" id="tabRev"></span></button>
  <button data-v="clientes"><span class="i">👥</span>Clientes</button>
  <button data-v="mas"><span class="i">⚙️</span>Más<span class="badge hidden chat-num"></span></button>
</nav>

<script src="../shared/config.js?v=2.2"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/vendor/qrcode.js"></script>
<script src="../shared/app.js?v=2.2"></script>
<script src="taller.js?v=2.2"></script>
<script src="../shared/iconos.js"></script>
<script src="../shared/instalar.js"></script>
<script src="../shared/barra.js"></script>
<script src="../shared/auto.js"></script>
<script src="../shared/fotos.js"></script>
<script src="../shared/voz.js"></script>
<script src="../shared/respaldo.js"></script>
<script src="../shared/pagos.js"></script>
<script src="../shared/verificar.js"></script>
<script src="../shared/premium.js"></script>
<script src="../shared/ayuda.js"></script>
</body>
</html>
