name: Publicar la app (GitHub Pages)

# Cada cambio en main le pide a GitHub Pages que vuelva a publicar el sitio.
# Sirve cuando la publicación automática no se dispara sola. También se puede correr a mano
# (Actions → "Publicar la app" → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir una publicación nueva
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
